name: L2-r4 isolated CAD and FEM checks
on:
  push:
    branches: [l2-r4-build]
    paths: ['cad/l2_r4/**', '.github/workflows/l2-r4-build.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: l2-r4-build
  cancel-in-progress: true
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      artifact_sha: ${{ steps.checkpoint.outputs.sha }}
      run_windows: ${{ steps.checkpoint.outputs.windows }}
      parallel: ${{ steps.checkpoint.outputs.parallel }}
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      CCX_NPROC_RESULTS: '1'
      CCX_NPROC_STIFFNESS: '1'
      NUMBER_OF_CPUS: '1'
    steps:
      - name: Read exact work-branch commit
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Prepare isolated toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq calculix-ccx libglu1-mesa libgl1 libopengl0 libegl1 fonts-noto-cjk xvfb
          python3 -m venv _support/venv
          _support/venv/bin/pip install --disable-pip-version-check cadquery==2.8.0 gmsh==4.15.2 trimesh scipy pillow psutil shapely matplotlib rtree pymeshlab
          free -h
          _support/venv/bin/python -c "import subprocess; r=subprocess.run(['ccx','-v'],capture_output=True,text=True); print(r.stdout+r.stderr); assert r.returncode in (0,201) and 'Version 2.21' in r.stdout+r.stderr, (r.returncode,r.stdout,r.stderr)"
      - name: Execute finite checks with per-stage evidence checkpoints
        run: xvfb-run -a _support/venv/bin/python -u cad/l2_r4/ci_run.py
      - name: Preserve candidate results and errors without releasing
        id: checkpoint
        if: always() && !cancelled()
        run: |
          python3 cad/l2_r4/ci_checkpoint.py
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 -c "import json,os; c=json.load(open('cad/l2_r4/RUN.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('windows='+str(c.get('windows',False)).lower()+'\n')"
          python3 -c "import json,os; c=json.load(open('cad/l2_r4/RUN.json')); open(os.environ['GITHUB_OUTPUT'],'a').write('parallel='+str(c.get('parallel',False)).lower()+'\n')"
  independent_checks:
    needs: execute
    if: needs.execute.result == 'success' && needs.execute.outputs.parallel == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: diagnostic
            config: DIAGNOSTIC_RUN.json
          - role: motion
            config: MOTION_RUN.json
          - role: space
            config: SPACE_RUN.json
          - role: electronics
            config: ELECTRONICS_RUN.json
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      R4_TARGET_BRANCH: codex/r4-${{ matrix.role }}-${{ github.run_id }}
      ARTIFACT_SHA: ${{ needs.execute.outputs.artifact_sha }}
    steps:
      - name: Read identical immutable geometry for independent checks
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$ARTIFACT_SHA"
          git checkout --detach FETCH_HEAD
          sudo apt-get update -qq
          sudo apt-get install -y -qq libglu1-mesa libgl1 libopengl0 libegl1 fonts-noto-cjk xvfb
          python3 -m venv _support/venv
          _support/venv/bin/pip install --disable-pip-version-check cadquery==2.8.0 gmsh==4.15.2 trimesh scipy pillow psutil shapely matplotlib rtree pymeshlab
      - name: Numerical checks with independent result branches
        run: xvfb-run -a _support/venv/bin/python -u cad/l2_r4/ci_run.py --config cad/l2_r4/${{ matrix.config }}
      - name: Preserve actual result even if a criterion fails
        if: always() && !cancelled()
        run: python3 cad/l2_r4/ci_checkpoint.py
  windows_artifacts:
    needs: execute
    if: needs.execute.result == 'success' && needs.execute.outputs.run_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      R4_TARGET_BRANCH: codex/r4-print-${{ github.run_id }}
    steps:
      - name: Read the exact Linux artifact checkpoint
        shell: pwsh
        env:
          ARTIFACT_SHA: ${{ needs.execute.outputs.artifact_sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin $env:ARTIFACT_SHA
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Artifact checkpoint checkout failed' }
      - name: Actual FreeCAD roundtrip and PrusaSlicer project slicing
        shell: pwsh
        run: ./cad/l2_r4/windows_deliverables.ps1
      - name: Preserve Windows artifact evidence
        if: always() && !cancelled()
        shell: pwsh
        run: python cad/l2_r4/ci_checkpoint.py
